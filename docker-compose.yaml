services:
  ros2_desktop:
    build: .
    image: bira/ros2-humble-vnc
    container_name: ros2_humble_desktop
    security_opt:
      - seccomp:unconfined
    shm_size: "512m"
    restart: unless-stopped
    ports:
      - "6080:80"   # interface web -> http://localhost:6080
    volumes:
      - ./src:/home/ubuntu/BIRA/src
